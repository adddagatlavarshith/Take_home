version: '3.9'

# Optional observability stack. Start with:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d

services:
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.111.0
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
    networks: [amrutam]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
    networks: [amrutam]

  loki:
    profiles: [observability]
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [amrutam]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail.yaml:/etc/promtail/config.yml:ro
    networks: [amrutam]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    networks: [amrutam]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [amrutam]

volumes:
  tempo_data:
  loki_data:
  prom_data:
  grafana_data:

networks:
  amrutam:
    external: true
